name: Publish Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Use pnpm with npm trusted publishing support
        run: npm install -g pnpm@11.0.9 && pnpm --version
        env:
          PNPM_CONFIG_PM_ON_FAIL: ignore

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PM_ON_FAIL: ignore

  snapshot:
    name: Canary Snapshot
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    concurrency:
      group: canary-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Use pnpm with npm trusted publishing support
        run: npm install -g pnpm@11.0.9 && pnpm --version
        env:
          PNPM_CONFIG_PM_ON_FAIL: ignore

      - name: Publish canary
        id: publish
        env:
          PNPM_CONFIG_PM_ON_FAIL: ignore
        run: |
          pnpm changeset version --snapshot pr-${{ github.event.pull_request.number }}
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm changeset publish --tag canary --no-git-tag
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.publish.outputs.version }}';
            const marker = '<!-- canary-publish -->';
            const body = [
              marker,
              '## Canary package',
              '',
              '```',
              `pnpm add @agentcash/router@${version}`,
              '```',
              '',
              `_Updated ${new Date().toUTCString()}_`,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
